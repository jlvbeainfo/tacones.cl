services:
  tacones-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://taconesonline.cl}
        NEXT_PUBLIC_WORDPRESS_URL: ${NEXT_PUBLIC_WORDPRESS_URL:-https://api.taconesonline.cl}
    container_name: tacones-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://taconesonline.cl}
      NEXT_PUBLIC_WORDPRESS_URL: ${NEXT_PUBLIC_WORDPRESS_URL:-https://api.taconesonline.cl}
      WOOCOMMERCE_API_URL: ${WOOCOMMERCE_API_URL:-https://api.taconesonline.cl/wp-json/wc/v3}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:?Falta WOOCOMMERCE_CONSUMER_KEY}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:?Falta WOOCOMMERCE_CONSUMER_SECRET}
      CHECKOUT_SIGNING_SECRET: ${CHECKOUT_SIGNING_SECRET:?Falta CHECKOUT_SIGNING_SECRET}
